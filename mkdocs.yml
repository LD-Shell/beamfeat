site_name: beamfeat
site_description: Beam-search feature construction with FDR-controlled selection
site_author: Olanrewaju M. Daramola
copyright: '&copy; 2026 <a href="https://orcid.org/0009-0006-3327-2047" rel="author">Olanrewaju M. Daramola</a> (ORCID)'
repo_url: https://github.com/LD-Shell/beamfeat
site_url: https://ld-shell.github.io/beamfeat/
edit_uri: edit/main/docs/
theme:
  name: material
  custom_dir: overrides
  icon:
    repo: fontawesome/brands/github
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - scheme: default
      toggle: {icon: material/brightness-7, name: dark mode}
    - scheme: slate
      toggle: {icon: material/brightness-4, name: light mode}
extra_css:
  - stylesheets/extra.css
exclude_docs: |
  sphinx_roles.py
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
nav:
  - Home: index.md
  - Get started:
      - Installation: installation.md
      - Quickstart: quickstart.md
      - Choosing a setting: settings.md
      - Migrating from autofeat: migrating-from-autofeat.md
  - User guide:
      - guide/index.md
      - Reading a fit: guide/reading-a-fit.md
      - The printed equation: guide/printed-equation.md
      - Search options: guide/search.md
      - Data and prediction: guide/data.md
  - Tutorials:
      - Getting started: notebooks/01_getting_started.ipynb
      - Search and scoring: notebooks/02_search_and_scoring.ipynb
      - Selection and units: notebooks/03_selection_and_units.ipynb
      - Reading a fit: notebooks/04_reading_a_fit.ipynb
  - Reference and API:
      - API reference: api.md
      - Statistical guarantees: guarantees.md
      - Benchmarks: benchmarks.md
      - Citing beamfeat: citing.md
      - Changelog: changelog.md
plugins:
  - search
  - mkdocs-jupyter:
      include_source: true
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            extensions:
              - docs/sphinx_roles.py:SphinxRoles
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.arithmatex
