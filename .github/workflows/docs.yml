name: docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", "overrides/**", "README.md", "CHANGELOG.md", "src/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[docs]"
      - run: mkdocs gh-deploy --force
