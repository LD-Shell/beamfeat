name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:
  # Weekly, so that a new release of a dependency is tested even when nothing
  # here has changed. GitHub notifies whoever last changed the schedule when a
  # scheduled run fails.
  schedule:
    - cron: "0 6 * * 1"

jobs:
  tests:
    name: tests (py${{ matrix.python-version }}, latest deps)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[all]" pytest-cov
      - run: python -m pytest -q --cov=beamfeat --cov-report=term --cov-fail-under=90

  floor-versions:
    name: oldest supported stack (numpy 1.26, scikit-learn 1.6, joblib 1.2, scipy 1.10, no pint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install "numpy==1.26.4" "scikit-learn==1.6.1" "joblib==1.2.0" "scipy==1.10.1" -e ".[test]"
      # pint deliberately absent: unit-dependent tests must skip with a
      # visible reason, and everything else must pass.
      - run: python -m pytest -q -rs

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check src tests benchmarks

  notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[all]" nbmake
      - run: python -m pytest --nbmake notebooks/*.ipynb --nbmake-timeout=900 -q
