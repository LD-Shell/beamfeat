name: upcoming dependencies

# The test suite against the pre-releases and nightly builds of the libraries
# beamfeat rests on, so that an upstream change shows up here before it is
# released. It runs weekly and on demand only: a failure here blocks no pull
# request and no release, and GitHub notifies whoever last changed the
# schedule when a scheduled run fails.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  tests:
    name: tests (py3.13, nightly numpy, scipy, scikit-learn, pandas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[all]"
      - run: >-
          python -m pip install --upgrade --pre --only-binary :all:
          --extra-index-url https://pypi.anaconda.org/scientific-python-nightly-wheels/simple
          numpy scipy scikit-learn pandas
      - run: python -m pip list
      - run: python -m pytest -q
