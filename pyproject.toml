[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "beamfeat"
description = "Beam-search feature construction with false-discovery-rate controlled selection"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Olanrewaju M. Daramola" }]
keywords = [
  "feature-engineering",
  "feature-selection",
  "false-discovery-rate",
  "knockoffs",
  "symbolic-features",
  "automl",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering",
]
# Floors are the oldest versions the test suite is actually run against
# (see the `floor-versions` CI job). No upper pins: pinning `<2.0` style
# ceilings strands users when the ecosystem moves, which is one of the
# problems this library exists to avoid.
# joblib is imported directly by the search; scikit-learn already requires it,
# so it adds nothing to an install, and 1.2 is scikit-learn 1.6's own floor.
# scipy likewise (the constant fits use its bounded scalar minimiser); 1.10 is
# the oldest that installs beside numpy 1.26 on Python 3.10.
dependencies = [
  "joblib>=1.2",
  "numpy>=1.26",
  "scikit-learn>=1.6",
  "scipy>=1.10",
]
dynamic = ["version"]

[project.optional-dependencies]
# Unit-aware search accepts any object exposing pint's Quantity interface;
# pint is the implementation it is tested against.
units = ["pint>=0.24"]
display = ["sympy>=1.13"]
notebooks = ["pandas>=2.0"]
test = ["pytest>=8", "pytest-cov>=5", "sympy>=1.13"]
docs = ["mkdocs-jupyter",
    "mkdocs-material>=9.5", "mkdocstrings[python]>=0.26"]
benchmarks = ["lightgbm>=4", "knockpy>=1.3", "matplotlib>=3.7", "pandas>=2.0"]
all = ["beamfeat[units,display,test,notebooks]"]

[project.urls]
Homepage = "https://github.com/LD-Shell/beamfeat"
Documentation = "https://ld-shell.github.io/beamfeat/"
Issues = "https://github.com/LD-Shell/beamfeat/issues"

[tool.hatch.version]
path = "src/beamfeat/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/beamfeat"]

[tool.hatch.build.targets.sdist]
include = [
  "src",
  "tests",
  "README.md",
  "LICENSE",
  "CITATION.cff",
  "CHANGELOG.md",
  "pyproject.toml",
  # the benchmark scripts and the archived results the README's figures
  # come from
  "benchmarks/*.py",
  "benchmarks/*.ipynb",
  "benchmarks/*.json",
  "benchmarks/*.csv",
]
# The vendored external comparison study is ~540 KB of raw data and notebooks,
# so it stays in the repository and out of the sdist.
exclude = ["benchmarks/independent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: long-running checks (sklearn check_estimator); run with `-m slow`",
]
# Deprecations fail the suite while the old behaviour still works.
# scikit-learn announces a removal with FutureWarning, wherever it is raised;
# numpy and the standard library use DeprecationWarning, which counts when it
# points at beamfeat or its tests, since a dependency's own internal use is
# not something this package can fix (scikit-learn 1.6 still passes a
# deprecated option to scipy, for one). Silence third-party noise with a
# narrow "ignore" entry naming its message, never by widening these.
filterwarnings = [
  "error::FutureWarning",
  "error::DeprecationWarning:beamfeat",
  "error::PendingDeprecationWarning:beamfeat",
  "error::DeprecationWarning:tests",
  "error::PendingDeprecationWarning:tests",
]

[tool.ruff]
line-length = 110
target-version = "py310"
# benchmarks/independent/ carries the external comparison study. Its style is
# left as written rather than restyled to this project's conventions; it is
# excluded from linting, not from correction.
# Notebooks are executed documentation: their quality gate is nbmake
# execution in CI, not import ordering, so ruff's notebook linting is off.
extend-exclude = ["benchmarks/independent", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]
